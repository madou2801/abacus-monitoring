# Nginx - abacus-rh.com
# A placer dans /etc/nginx/sites-available/abacus-rh.com puis :
#   ln -s /etc/nginx/sites-available/abacus-rh.com /etc/nginx/sites-enabled/
#   certbot --nginx -d abacus-rh.com -d www.abacus-rh.com
#   nginx -t && systemctl reload nginx
#
# NOTE : si un vhost abacus-rh.com existe deja sur le VPS (le domaine est
# actuellement monitore), fusionner ce bloc avec l'existant plutot que de
# le remplacer, et verifier les sous-domaines platform/formations/academy.

server {
    listen 80;
    listen [::]:80;
    server_name abacus-rh.com www.abacus-rh.com;

    # Redirection HTTPS ajoutee automatiquement par certbot apres emission du certificat
    location / {
        proxy_pass http://127.0.0.1:3820;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3820;
        access_log off;
    }
}
