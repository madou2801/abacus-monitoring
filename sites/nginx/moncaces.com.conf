# Nginx - moncaces.com
# A placer dans /etc/nginx/sites-available/moncaces.com puis :
#   ln -s /etc/nginx/sites-available/moncaces.com /etc/nginx/sites-enabled/
#   certbot --nginx -d moncaces.com -d www.moncaces.com
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name moncaces.com www.moncaces.com;

    # Redirection HTTPS ajoutee automatiquement par certbot apres emission du certificat
    location / {
        proxy_pass http://127.0.0.1:3810;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Ne pas exposer le health check public au-dela du monitoring
    location = /health {
        proxy_pass http://127.0.0.1:3810;
        access_log off;
    }
}
