# Site de jeux — à insérer dans le server block du domaine choisi.
#
# Le point important est le bloc /ws : sans les deux en-têtes Upgrade et
# Connection, nginx ferme la WebSocket et la partie à distance ne démarre pas.

location /ws {
    proxy_pass http://127.0.0.1:3860;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Une partie peut rester silencieuse longtemps : le serveur envoie une
    # sonde toutes les 25 s, on laisse largement la place.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location / {
    proxy_pass http://127.0.0.1:3860;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}
